services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dibonke_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dibonke_bookshop_db}
      DB_USER: ${DB_USER:-dibonke}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Africa/Nairobi
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',80); exit($$s?0:1);"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:10.11
    container_name: dibonke_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dibonke_bookshop_db}
      MARIADB_USER: ${DB_USER:-dibonke}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: Africa/Nairobi
    volumes:
      - dibonke_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dibonke_db_data:
